# Codecov configuration
codecov:
    notify:
        # CI sends notifications after all coverage jobs finish, regardless of
        # how many uploads they produce. This avoids premature coverage reports.
        manual_trigger: true

coverage:
    status:
        project:
            default:
                # Report a CI failure if coverage drops by more than 1 percent.
                threshold: 1%
