name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: ${{ !(contains(github.ref, 'release/') || contains(github.ref, 'master')) }}

on:
  # Run this workflow on every push to the master branch, or a stable branch.
  push:
    branches:
      - master
      - "stable/**"
      - "feature/**"
  pull_request:
    branches:
      - master
      - 'stable/**'
      - 'feature/**'

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  test_dev:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: Regression Tests
    uses: ./.github/workflows/regression-tests.yml
    with:
      test_task: dev_test
      collect_coverage: true
      group: ci-free

  test_dev_licensed:
    needs: changes
    if: github.repository == 'cocotb/cocotb' && needs.changes.outputs.run_tests == 'true'
    name: Regression Tests
    uses: ./.github/workflows/regression-tests.yml
    with:
      test_task: dev_test
      collect_coverage: true
      group: ci-licensed

  codecov_notify:
    name: Send Codecov notifications
    needs: [test_dev, test_dev_licensed]
    # Notify after coverage jobs finish, including failures, unless all were skipped.
    # The regex matches anything in this job's 'needs' section's results.
    if: >-
      ${{ !cancelled() &&
          (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Match the upload jobs so Codecov resolves the same PR head commit.
        fetch-depth: 2
    - name: Send notifications
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      env:
        CODECOV_TOKEN: 669f2048-851e-479e-a618-8fa64f3736cc
      with:
        run_command: send-notifications
